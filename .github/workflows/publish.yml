# Publicador do Postly: publica no Instagram os posts cujo horário chegou.
# Roda a cada 5 minutos (o GitHub pode atrasar execuções agendadas em alguns minutos)
# e também quando o site pede ("Publicar agora" ou ao conectar uma conta).
name: Postly - publicar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'publish (publicar posts vencidos) ou connect (conectar conta)'
        required: false
        default: publish
      secret:
        description: 'Nome do secret com o token da conta (apenas para connect)'
        required: false
        default: ''

# Uma execução por vez, sem cancelar a que está rodando.
# Conectar conta usa um grupo separado para não esperar na fila do publicador.
concurrency:
  group: postly-${{ inputs.action == 'connect' && 'connect' || 'publisher' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # para pedir um novo deploy do site quando uma mídia ainda não estiver no ar

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Configurar git
        run: |
          git config user.name "postly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar
        run: node scripts/publish.mjs "$POSTLY_MODE"
        env:
          POSTLY_MODE: ${{ inputs.action || 'publish' }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          POSTLY_GH_TOKEN: ${{ secrets.POSTLY_GH_TOKEN }}
          POSTLY_PUBLIC_URL: ${{ vars.POSTLY_PUBLIC_URL }}
          # Versão da API da Meta. Para trocar sem mexer no código, crie a variável
          # GRAPH_API_VERSION em Settings › Secrets and variables › Actions › Variables.
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v27.0' }}
          CONNECT_SECRET: ${{ inputs.secret }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Postly</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="login-page">
    <form class="card login-card stack" id="login">
      <div class="brand" style="padding:0">
        <div class="brand-mark">P</div> Postly
      </div>
      <div>
        <h1 style="font-size:20px">Entrar no painel</h1>
        <p class="muted small" style="margin:4px 0 0">Agende publicações nas suas contas do Instagram.</p>
      </div>
      <label class="field">Senha
        <input class="input" type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <div class="alert alert-danger hidden" id="err"></div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('login');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: form.password.value }),
      });
      if (res.ok) return (location.href = '/');
      const data = await res.json().catch(() => ({}));
      err.textContent = data.error || 'Não foi possível entrar.';
      err.classList.remove('hidden');
    });
  </script>
</body>
</html>

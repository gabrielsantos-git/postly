<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postly</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand"><div class="brand-mark">P</div> Postly</div>
      <a class="nav-link" href="#/" data-nav="painel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Painel
      </a>
      <a class="nav-link" href="#/calendario" data-nav="calendario">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        Calendário
      </a>
      <a class="nav-link" href="#/novo" data-nav="novo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Novo post
      </a>
      <a class="nav-link" href="#/contas" data-nav="contas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        Contas
      </a>
      <span class="nav-link" title="Próxima etapa" style="cursor:default">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
        WhatsApp <span class="soon">em breve</span>
      </span>
      <div class="sidebar-footer">
        <button class="nav-link btn-ghost" id="logout" style="border:0;background:none;font:inherit;cursor:pointer;width:100%">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Sair
        </button>
      </div>
    </nav>
    <main class="main" id="view"></main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
